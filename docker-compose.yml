name: logosai

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LOGOSAI_GATEWAY_SECRET: "${LOGOSAI_GATEWAY_SECRET:-logosai-local-only-gateway-secret-2026}"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: cloudflare/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FASTAPI_ORIGIN: "http://backend:8000"
      BETTER_AUTH_URL: "http://localhost:${LOGOSAI_APP_PORT:-5173}"
      TRUSTED_ORIGINS: "http://localhost:${LOGOSAI_APP_PORT:-5173},http://127.0.0.1:${LOGOSAI_APP_PORT:-5173}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-logosai-local-only-auth-secret-change-me-2026}"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      GATEWAY_SHARED_SECRET: "${LOGOSAI_GATEWAY_SECRET:-logosai-local-only-gateway-secret-2026}"
    ports:
      - "${LOGOSAI_APP_PORT:-5173}:8787"
    volumes:
      - logosai_d1:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/public/auth-config').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  logosai_d1:
