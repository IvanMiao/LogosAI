name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Detect migration-relevant changes
        id: migration-changes
        working-directory: .
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$MIGRATION_BASE_REF"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            echo "Migration base unavailable; running D1 migration checks against origin/main."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base-ref=origin/main" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- \
            'cloudflare/migrations/**' \
            'cloudflare/scripts/check-d1-migrations.mjs' \
            'cloudflare/tests/fixtures/migration-*' \
            'cloudflare/package.json' 'cloudflare/package-lock.json' \
            '.github/workflows/ci.yml'; then
            echo "Skipping D1 migration checks: no migration-relevant files changed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Migration-relevant changes detected; running D1 migration checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base-ref=$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Check D1 migration history and upgrades
        if: steps.migration-changes.outputs.run == 'true'
        run: npm run test:db:migrations
        timeout-minutes: 10
        env:
          MIGRATION_BASE_REF: ${{ steps.migration-changes.outputs.base-ref }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -v
